<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHASHMA - Ro'yxatdan o'tish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0f2f5 0%, #dce1e8 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
            margin: 0;
        }

        /* Asosiy quti */
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 40px 30px; border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.12); 
            width: 100%; max-width: 440px; 
            text-align: center; position: relative;
            transition: all 0.3s ease;
            display: block;
        }
        .container:hover { transform: translateY(-3px); }
        
        /* Chap yuqori logotip */
        .top-logo {
            position: absolute;
            top: 20px;
            left: 24px;
            text-align: left;
        }
        .top-logo img {
            max-width: 110px;
            height: auto;
            display: block;
        }
        
        h3 { 
            color: #1a2a3a; 
            margin-top: 55px; 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 24px; 
            letter-spacing: -0.5px;
        }

        /* Inputlar */
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #34495e; margin-bottom: 6px; }
        
        .phone-wrapper {
            display: flex;
            border: 2px solid #e1e4e8;
            border-radius: 12px;
            background: #f8f9fa;
            overflow: hidden;
            transition: 0.3s;
        }
        .phone-wrapper:focus-within {
            border-color: #B8860B;
            background: white;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15);
        }
        .phone-prefix {
            background: #e9ecef;
            padding: 12px 15px;
            font-weight: 700;
            color: #2c3e50;
            border-right: 2px solid #e1e4e8;
            font-size: 15px;
            white-space: nowrap;
        }
        .phone-wrapper input {
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 12px 15px !important;
        }
        
        input, select { 
            width: 100%; padding: 12px 15px; border: 2px solid #e1e4e8; border-radius: 12px; 
            font-size: 15px; transition: 0.3s; background: #f8f9fa; outline: none; font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { border-color: #B8860B; background: white; box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15); }
        
        button { 
            width: 100%; padding: 16px; background: linear-gradient(145deg, #B8860B, #8B6508); 
            color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; 
            cursor: pointer; margin-top: 15px; transition: 0.3s; letter-spacing: 1px;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(184, 134, 11, 0.4); }
        button:active { transform: scale(0.97); }
        
        /* Xatolik xabari */
        #error-message {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-weight: 600;
            text-align: center;
        }

        /* Mobil uchun */
        @media (max-width: 480px) {
            .container { padding: 25px 20px; max-width: 100%; margin: 0 10px; }
            .top-logo img { max-width: 80px; }
            h3 { margin-top: 45px; font-size: 20px; }
        }

        /* -------------- ALOHIDA SAHIFA (RAHMAT OYNASI) -------------- */
        #success-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        #success-overlay.active {
            display: flex;
        }
        .success-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: popUp 0.4s ease;
        }
        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .success-card .big-thanks { 
            font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #B8860B; 
        }
        .success-card .contact-link { 
            display: inline-block; font-weight: 700; color: #1a2a3a; 
            text-decoration: none; margin: 10px 0; font-size: 18px; 
        }
        .success-card .contact-link:hover { color: #B8860B; }
        .success-card .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .success-card .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            flex: 1;
        }
        .success-card .social-btn svg {
            width: 20px; height: 20px; fill: currentColor;
        }
        .success-card .social-btn.telegram { background: #0088cc; }
        .success-card .social-btn.telegram:hover { background: #006699; transform: scale(1.05); }
        .success-card .social-btn.instagram { background: #E1306C; }
        .success-card .social-btn.instagram:hover { background: #b81d54; transform: scale(1.05); }

        @media (max-width: 480px) {
            .success-card { padding: 30px 20px; }
            .success-card .social-buttons { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <!-- ASOSIY SAHIFA -->
    <div class="container" id="main-page">
        <div class="top-logo">
            <img src="chashma_logo.png" alt="CHASHMA Learning Centre">
        </div>

        <h3>Ro'yxatdan o'ting</h3>
        
        <form id="registerForm">
            <div class="input-group">
                <label for="name">Ism va Familiya</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="input-group">
                <label for="phone">Telefon raqam</label>
                <div class="phone-wrapper">
                    <div class="phone-prefix">+998</div>
                    <input type="text" id="phone" placeholder="90 123 45 67" required maxlength="9">
                </div>
            </div>
            
            <div class="input-group">
                <label for="age">Yosh</label>
                <input type="number" id="age" placeholder="18" min="1" max="120" required>
            </div>
            
            <div class="input-group">
                <label for="course">Qaysi kursga qiziqasiz?</label>
                <select id="course" required>
                    <option value="">Tanlang...</option>
                    <option value="Ingliz tili">Ingliz tili</option>
                    <option value="Rus tili">Rus tili</option>
                    <option value="Arab tili">Arab tili</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">Ro'yxatdan o'tish</button>
        </form>

        <!-- Qisqa xato xabari -->
        <div id="error-message"></div>
    </div>


    <!-- ALOHIDA SAHIFA (RAHMAT OYNASI) -->
    <div id="success-overlay">
        <div class="success-card">
            <div class="big-thanks">✅ RO'YXATDAN O'TGANINGIZ UCHUN RAHMAT</div>
            <div style="font-size:15px; margin-bottom:5px; color:#374151;">Tez orada</div>
            <a href="tel:+998700790089" class="contact-link">📞 +998 70 079 00 89</a>
            <div style="font-size:14px; color:#374151; margin-top:5px;">raqami orqali sizga aloqaga chiqishadi.</div>
            
            <div style="margin-top:20px; font-weight:600; color:#1a2a3a; font-size:14px;">Bizni kuzatib boring:</div>
            <div class="social-buttons">
                <a href="https://t.me/CHASHMA_LEARNING" target="_blank" class="social-btn telegram">
                    <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    Telegram
                </a>
                <a href="https://www.instagram.com/chashma_learning" target="_blank" class="social-btn instagram">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    Instagram
                </a>
            </div>
        </div>
    </div>

    <script>
        // Telefon raqamga faqat raqamlar kiritish
        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9);
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('submitBtn');
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = "Yuborilmoqda...";

            // Telefon kompaniyasini tekshirish
            const phoneRaw = document.getElementById('phone').value;
            const phoneCode = phoneRaw.substring(0, 2);
            const validCodes = ['90','91','93','94','95','97','98','99','33','20'];

            if (!validCodes.includes(phoneCode) || phoneRaw.length !== 9) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "⚠️ Bunday telefon raqam mavjud emas";
                submitBtn.disabled = false;
                submitBtn.innerText = "Ro'yxatdan o'tish";
                return;
            }

            // Data tayyorlash
            const data = {
                name: document.getElementById('name').value,
                phone: '+998' + phoneRaw,
                age: document.getElementById('age').value,
                course: document.getElementById('course').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    // ASOSIY SAHIFANI YASHIRIB, ALOHIDA SAHIFANI KO'RSATISH
                    document.getElementById('main-page').style.display = 'none';
                    document.getElementById('success-overlay').classList.add('active');
                    document.getElementById('registerForm').reset();
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = "❌ " + result.message;
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "❌ Ulanishda xatolik! Internetni tekshiring.";
            }

            submitBtn.disabled = false;
            submitBtn.innerText = "Ro'yxatdan o'tish";
        });
    </script>
</body>
</html>
