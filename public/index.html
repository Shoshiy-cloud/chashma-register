<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHASHMA - Ro'yxatdan o'tish</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { color: #B8860B; font-size: 32px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; }
        .sub-logo { color: #1b2a4a; font-size: 16px; letter-spacing: 4px; margin-bottom: 25px; border-bottom: 2px solid #B8860B; display: inline-block; padding-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #B8860B; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #8B6508; }
        #message { margin-top: 15px; font-weight: bold; display: none; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CHASHMA</div>
        <div class="sub-logo">LEARNING CENTRE</div>
        <h3>Kursga ro'yxatdan o'ting</h3>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Ism va Familiya" required>
            <input type="tel" id="phone" placeholder="Telefon raqam (+998...)" required>
            <select id="course" required>
                <option value="">Qaysi kursga qiziqasiz?</option>
                <option value="Ingliz tili">Ingliz tili</option>
                <option value="Matematika">Matematika</option>
                <option value="Dasturlash">Dasturlash</option>
                <option value="Boshqa">Boshqa</option>
            </select>
            <button type="submit">Ro'yxatdan o'tish</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.style.display = 'none';

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                course: document.getElementById('course').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    msgDiv.className = 'success';
                    msgDiv.innerText = result.message;
                    msgDiv.style.display = 'block';
                    document.getElementById('registerForm').reset();
                } else {
                    msgDiv.className = 'error';
                    msgDiv.innerText = result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (error) {
                msgDiv.className = 'error';
                msgDiv.innerText = "Ulanishda xatolik!";
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
