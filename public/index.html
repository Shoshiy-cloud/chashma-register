<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHASHMA - Ro'yxatdan o'tish</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .container { 
            background: white; padding: 40px 35px; border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 420px; 
            text-align: center; transition: transform 0.3s ease; position: relative;
        }
        .container:hover { transform: translateY(-5px); }
        
        /* Chap yuqori burchakdagi logotip (RASM) */
        .top-logo {
            position: absolute;
            top: 15px;
            left: 20px;
            text-align: left;
        }
        .top-logo img {
            max-width: 120px;  /* Logotip o'lchami - kerak bo'lsa o'zgartirishingiz mumkin */
            height: auto;
            display: block;
        }
        
        h3 { color: #333; margin-top: 30px; margin-bottom: 20px; font-weight: 600; font-size: 22px; }
        
        /* Inputlar dizayni */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 5px; }
        input, select { 
            width: 100%; padding: 12px 15px; border: 2px solid #e1e4e8; border-radius: 8px; 
            font-size: 15px; transition: 0.3s; background: #f9f9f9; outline: none;
        }
        input:focus, select:focus { border-color: #B8860B; background: white; box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15); }
        
        button { 
            width: 100%; padding: 14px; background: linear-gradient(145deg, #B8860B, #8B6508); 
            color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; 
            cursor: pointer; margin-top: 10px; transition: 0.3s; letter-spacing: 1px;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(184, 134, 11, 0.4); }
        button:active { transform: scale(0.98); }
        
        #message { margin-top: 15px; font-weight: 600; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chap yuqori burchakdagi logotip (RASM) -->
        <div class="top-logo">
            <img src="chashma_logo.png" alt="CHASHMA Learning Centre">
        </div>

        <h3>Ro'yxatdan o'ting</h3>
        
        <form id="registerForm">
            <!-- Ism -->
            <div class="input-group">
                <label for="name">Ism va Familiya</label>
                <input type="text" id="name" required>
            </div>
            
            <!-- Telefon -->
            <div class="input-group">
                <label for="phone">Telefon raqam</label>
                <input type="tel" id="phone" required>
            </div>
            
            <!-- Yosh -->
            <div class="input-group">
                <label for="age">Yosh</label>
                <input type="number" id="age" min="1" max="120" required>
            </div>
            
            <!-- Kurs -->
            <div class="input-group">
                <label for="course">Qaysi kursga qiziqasiz?</label>
                <select id="course" required>
                    <option value="">Tanlang...</option>
                    <option value="Ingliz tili">Ingliz tili</option>
                    <option value="Rus tili">Rus tili</option>
                    <option value="Arab tili">Arab tili</option>
                </select>
            </div>
            
            <button type="submit">Ro'yxatdan o'tish</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.className = '';
            msgDiv.style.display = 'none';

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                age: document.getElementById('age').value,
                course: document.getElementById('course').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    msgDiv.className = 'success';
                    msgDiv.innerText = result.message;
                    msgDiv.style.display = 'block';
                    document.getElementById('registerForm').reset();
                } else {
                    msgDiv.className = 'error';
                    msgDiv.innerText = result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (error) {
                msgDiv.className = 'error';
                msgDiv.innerText = "Ulanishda xatolik!";
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
