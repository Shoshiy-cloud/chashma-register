<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHASHMA - Ro'yxatdan o'tish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0d121f; /* Cambridge uslubidagi qorong'u fon */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ASOSIY KONTEYNER (Harakatlanuvchi oynalar) */
        .app-container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        /* OYNA 1: RO'YXATDAN O'TISH (Chapdan kirib keladi) */
        #slide-form {
            background: #ffffff;
            border-radius: 32px 32px 32px 32px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
            /* Chapdan kirish animatsiyasi */
            animation: slideInFromLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateX(-120%);
            opacity: 0;
        }
        @keyframes slideInFromLeft {
            0% { transform: translateX(-120%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* OYNA 2: RAHMAT SAHIFASI (O'ngdan kirib keladi) */
        #slide-success {
            background: #0d121f;
            border-radius: 32px;
            padding: 50px 25px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            /* O'ngdan kirish animatsiyasi */
        }
        #slide-success.active {
            display: flex;
            animation: slideInFromRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateX(120%);
            opacity: 0;
        }
        @keyframes slideInFromRight {
            0% { transform: translateX(120%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* ----- LOGOTIP ----- */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }
        
        /* TIL TANLASH (Dropdown) */
        .lang-selector {
            background: #eef2f6;
            border-radius: 30px;
            padding: 6px 14px 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #1b2a4a;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .lang-selector:hover {
            border-color: #B8860B;
        }
        .lang-selector select {
            background: transparent;
            border: none;
            outline: none;
            font-weight: 700;
            font-size: 14px;
            color: #1b2a4a;
            cursor: pointer;
        }

        /* ----- Sarlavha ----- */
        .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #1b2a4a; /* To'q ko'k */
            text-align: center;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        /* ----- FORMA (Minimalist dizayn) ----- */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
            margin-left: 4px;
        }
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            background: #f8fafc;
            transition: 0.3s ease;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            outline: none;
        }
        .form-group input:focus, 
        .form-group select:focus {
            border-color: #B8860B; /* Oltin rang */
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15);
        }
        
        /* Telefon uchun ixtisoslashtirilgan quti */
        .phone-wrapper {
            display: flex;
            align-items: center;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            background: #f8fafc;
            transition: 0.3s;
        }
        .phone-wrapper:focus-within {
            border-color: #B8860B;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15);
        }
        .phone-prefix {
            padding: 14px 12px 14px 16px;
            font-weight: 700;
            color: #1b2a4a;
            font-size: 16px;
            background: transparent;
            border-right: 1.5px solid #e2e8f0;
        }
        .phone-wrapper input {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 14px 16px 14px 12px !important;
            border-radius: 0 !important;
        }

        /* ----- 3D YALTIRAGAN TUGMA ----- */
        .btn-primary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            /* 3D ko'rinish va yaltirash */
            background: linear-gradient(145deg, #B8860B, #8B6508); /* Oltindan jigarrangga */
            box-shadow: 
                0 8px 25px rgba(184, 134, 11, 0.4),
                inset 0 1px 0 rgba(255,255,255,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        /* Yaltiroq effekt (shimmer) */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 40%, 
                rgba(255,255,255,0.2) 50%, 
                transparent 60%
            );
            animation: shimmer 3s infinite linear;
            pointer-events: none;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(25deg); }
            100% { transform: translateX(100%) rotate(25deg); }
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(184, 134, 11, 0.5);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            transform: scale(0.98);
            cursor: not-allowed;
        }

        /* XATOLIK XABARI */
        #error-message {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
        }

        /* ----- RAHMAT OYNASI (Success) ----- */
        .success-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #B8860B, #8B6508);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 10px 30px rgba(184, 134, 11, 0.3);
            margin-bottom: 25px;
        }
        .success-title {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .success-desc {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .success-contact {
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            margin: 5px 0 15px 0;
            display: inline-block;
        }
        .success-contact:hover {
            color: #B8860B;
        }

        /* ----- YANGI TELEGRAM TUGMASI (Rahmat oynasida) ----- */
        .btn-telegram {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(145deg, #00a3e0, #0076a3);
            box-shadow: 0 8px 25px rgba(0, 163, 224, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            transition: 0.3s;
        }
        .btn-telegram:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 35px rgba(0, 163, 224, 0.5);
        }
        .btn-telegram svg { width: 24px; height: 24px; fill: white; }

        @media (max-width: 480px) {
            .main-title { font-size: 22px; }
            .brand-logo img { height: 35px; }
            #slide-form { padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1-OYNA: RO'YXATDAN O'TISH (Chapdan kiradi) -->
    <div id="slide-form">
        <div class="brand-header">
            <div class="brand-logo">
                <img src="chashma_logo.png" alt="CHASHMA">
            </div>
            <div class="lang-selector">
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="uz">🇺🇿 O'zb</option>
                    <option value="ru">🇷🇺 Рус</option>
                    <option value="en">🇬🇧 Eng</option>
                </select>
            </div>
        </div>

        <h2 class="main-title" id="titleText">Darslarga yozilish uchun hoziroq ro'yxatdan o'ting</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name" id="labelName">Ism</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="phone" id="labelPhone">Telefon raqam</label>
                <div class="phone-wrapper">
                    <span class="phone-prefix">+998</span>
                    <input type="text" id="phone" placeholder="90 123 45 67" required maxlength="9">
                </div>
            </div>
            
            <div class="form-group">
                <label for="age" id="labelAge">Yoshingiz</label>
                <input type="number" id="age" placeholder="18" min="1" max="120" required>
            </div>
            
            <div class="form-group">
                <label for="course" id="labelCourse">Qaysi kursga qiziqasiz?</label>
                <select id="course" required>
                    <option value="" id="courseDefault">Tanlang...</option>
                    <option value="Ingliz tili" id="courseEng">Ingliz tili</option>
                    <option value="Rus tili" id="courseRus">Rus tili</option>
                    <option value="Arab tili" id="courseArab">Arab tili</option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary" id="submitBtn">Menga qo'ng'iroq qiling!</button>
        </form>

        <div id="error-message"></div>
    </div>


    <!-- 2-OYNA: RAHMAT SAHIFASI (O'ngdan kiradi) -->
    <div id="slide-success">
        <div class="success-icon">❤️</div>
        <h2 class="success-title" id="thanksTitle">Bizga bo'lgan ishonchingiz uchun rahmat</h2>
        
        <p class="success-desc" id="thanksDesc1">Operatorlarimiz tez orada siz bilan</p>
        <a href="tel:+998700790089" class="success-contact">+998 70 079 00 89</a>
        <p class="success-desc" id="thanksDesc2">raqami orqali bog'lanishadi.</p>

        <a href="https://t.me/CHASHMA_LEARNING" target="_blank" class="btn-telegram">
            <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            <span id="telegramText">Bizni Telegramda ham kuzatib boring</span>
        </a>
    </div>

</div>

<script>
    // Telefon raqamni tozalash
    document.getElementById('phone').addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9);
    });

    // TILLAR MA'LUMOTI
    const translations = {
        uz: {
            title: "Darslarga yozilish uchun hoziroq ro'yxatdan o'ting",
            labelName: "Ism",
            labelPhone: "Telefon raqam",
            labelAge: "Yoshingiz",
            labelCourse: "Qaysi kursga qiziqasiz?",
            courseDefault: "Tanlang...",
            courseEng: "Ingliz tili",
            courseRus: "Rus tili",
            courseArab: "Arab tili",
            submitBtn: "Menga qo'ng'iroq qiling!",
            thanksTitle: "Bizga bo'lgan ishonchingiz uchun rahmat",
            thanksDesc1: "Operatorlarimiz tez orada siz bilan",
            thanksDesc2: "raqami orqali bog'lanishadi.",
            telegramText: "Bizni Telegramda ham kuzatib boring"
        },
        ru: {
            title: "Запишитесь на уроки прямо сейчас",
            labelName: "Имя",
            labelPhone: "Номер телефона",
            labelAge: "Ваш возраст",
            labelCourse: "Какой курс вас интересует?",
            courseDefault: "Выберите...",
            courseEng: "Английский язык",
            courseRus: "Русский язык",
            courseArab: "Арабский язык",
            submitBtn: "Позвоните мне!",
            thanksTitle: "Спасибо за ваше доверие",
            thanksDesc1: "Наши операторы свяжутся с вами в ближайшее время по номеру",
            thanksDesc2: "",
            telegramText: "Следите за нами в Telegram"
        },
        en: {
            title: "Sign up for lessons right now",
            labelName: "Full Name",
            labelPhone: "Phone Number",
            labelAge: "Your Age",
            labelCourse: "Which course are you interested in?",
            courseDefault: "Choose...",
            courseEng: "English",
            courseRus: "Russian",
            courseArab: "Arabic",
            submitBtn: "Call me!",
            thanksTitle: "Thank you for your trust",
            thanksDesc1: "Our operators will contact you shortly at",
            thanksDesc2: "",
            telegramText: "Follow us on Telegram"
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];

        document.getElementById('titleText').innerText = t.title;
        document.getElementById('labelName').innerText = t.labelName;
        document.getElementById('labelPhone').innerText = t.labelPhone;
        document.getElementById('labelAge').innerText = t.labelAge;
        document.getElementById('labelCourse').innerText = t.labelCourse;
        document.getElementById('courseDefault').innerText = t.courseDefault;
        document.getElementById('courseEng').innerText = t.courseEng;
        document.getElementById('courseRus').innerText = t.courseRus;
        document.getElementById('courseArab').innerText = t.courseArab;
        document.getElementById('submitBtn').innerText = t.submitBtn;
        document.getElementById('thanksTitle').innerText = t.thanksTitle;
        document.getElementById('thanksDesc1').innerText = t.thanksDesc1;
        document.getElementById('thanksDesc2').innerText = t.thanksDesc2;
        document.getElementById('telegramText').innerText = t.telegramText;
    }

    // Formani yuborish va raqam tekshiruvi
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submitBtn');
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = "Yuborilmoqda...";

        const phoneRaw = document.getElementById('phone').value;
        const phoneCode = phoneRaw.substring(0, 2);
        const validCodes = ['90','91','93','94','95','97','98','99','33','20'];

        if (!validCodes.includes(phoneCode) || phoneRaw.length !== 9) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = "⚠️ Bunday telefon raqam mavjud emas";
            submitBtn.disabled = false;
            submitBtn.innerText = document.getElementById('submitBtn').innerText.replace("Yuborilmoqda...", "Menga qo'ng'iroq qiling!");
            return;
        }

        const data = {
            name: document.getElementById('name').value,
            phone: '+998' + phoneRaw,
            age: document.getElementById('age').value,
            course: document.getElementById('course').value
        };

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            if (result.success) {
                document.getElementById('slide-form').style.display = 'none';
                document.getElementById('slide-success').classList.add('active');
                document.getElementById('registerForm').reset();
            } else {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "❌ " + result.message;
            }
        } catch (error) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = "❌ Ulanishda xatolik! Internetni tekshiring.";
        }

        submitBtn.disabled = false;
        submitBtn.innerText = document.getElementById('submitBtn').innerText.replace("Yuborilmoqda...", "Menga qo'ng'iroq qiling!");
    });
</script>

</body>
</html>
